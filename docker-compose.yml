services:
  recipe-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recipe_book
    ports: ["3306:3306"]
    volumes: ["recipe_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  meal-plan-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meal_plan_db
    ports: ["3307:3306"]
    volumes: ["meal_plan_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  meal-plan-service:
    build: ./meal-plan-service
    environment:
      MEAL_DB_URL: jdbc:mysql://meal-plan-db:3306/meal_plan_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MEAL_DB_USERNAME: root
      MEAL_DB_PASSWORD: root
    ports: ["8081:8081"]
    depends_on:
      meal-plan-db:
        condition: service_healthy

  recipe-book:
    build: .
    environment:
      DB_URL: jdbc:mysql://recipe-db:3306/recipe_book?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      MEAL_PLAN_SERVICE_URL: http://meal-plan-service:8081
    ports: ["8080:8080"]
    depends_on:
      recipe-db:
        condition: service_healthy
      meal-plan-service:
        condition: service_started

volumes:
  recipe_data:
  meal_plan_data:
